name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          check-latest: true
          cache: false
      - name: Formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - run: python3 scripts/check-layers.py
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go run ./examples/wordcount
  differential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          check-latest: true
          cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: ./scripts/differential.sh
