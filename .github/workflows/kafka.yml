name: Kafka transaction integration
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  broker:
    name: broker (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: fixed-assignment
            tests: '^TestBroker(Recovery|Checkpoint|Fences|Explicit|Bounded)'
          - suite: group-restart
            tests: '^TestBrokerGroup(TransactionsRestartAndCommittedOffsets|RejectsUnsafeConfiguration)$'
          - suite: group-rebalance
            tests: '^TestBrokerGroupRebalanceDuringStaging$'
          - suite: group-crash
            tests: '^TestBrokerGroupRecoversKilledOpenTransaction$'
    services:
      kafka:
        image: apache/kafka:3.9.1
        ports:
          - 9092:9092
        env:
          CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_TRANSACTION_STATE_LOG_NUM_PARTITIONS: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - name: Verify dependency locks
        run: |
          go mod download
          go mod verify
          git diff --exit-code -- go.mod go.sum
      - name: Provision integration topics
        run: |
          docker exec '${{ job.services.kafka.id }}' /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --create --topic kstream-test-state --partitions 3 --replication-factor 1 --config cleanup.policy=compact --config retention.ms=-1
          docker exec '${{ job.services.kafka.id }}' /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --create --topic kstream-test-output --partitions 3 --replication-factor 1
          docker exec '${{ job.services.kafka.id }}' /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --create --topic kstream-test-input --partitions 3 --replication-factor 1
          docker exec '${{ job.services.kafka.id }}' /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --create --topic kstream-test-input-short --partitions 1 --replication-factor 1
      - name: Validate against a real Kafka broker
        env:
          KSTREAM_KAFKA_BROKERS: localhost:9092
          KSTREAM_KAFKA_STATE_DIR: ${{ runner.temp }}/kstream-persistent-caches
        run: go test -race -v -count=1 -run '${{ matrix.tests }}' ./adapters/kafka
