name: Exploratory Kafka comparison
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'
          cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: ./scripts/compare-engines.sh results/comparison
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exploratory-comparison
          path: results/comparison
