name: Fetch budget experiment
on:
  pull_request:
    paths:
      - '.github/workflows/fetch-budget.yml'
      - 'scripts/fetch-budget-matrix.py'
      - 'scripts/compare-brokers.py'
      - 'cmd/broker-app/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fetch-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      kafka:
        image: apache/kafka:3.9.1
        ports:
          - 9092:9092
        env:
          CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_TRANSACTION_STATE_LOG_NUM_PARTITIONS: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - name: Verify dependency locks
        run: |
          go mod download
          go mod verify
          git diff --exit-code -- go.mod go.sum
      - name: Build identical binaries for all configurations
        run: |
          mkdir -p /tmp/kstream-fetch-budget-bin
          go build -o /tmp/kstream-fetch-budget-bin/app ./cmd/broker-app
          go build -o /tmp/kstream-fetch-budget-bin/driver ./cmd/broker-driver
      - name: Compare balanced Go-only fetch budgets
        env:
          KSTREAM_BROKER_RECORDS: '1000000'
          KSTREAM_BROKER_WARMUP: '1000000'
          KSTREAM_BROKER_OUTPUT_CAPACITY: '4096'
        run: |
          python3 scripts/fetch-budget-matrix.py \
            --go-app /tmp/kstream-fetch-budget-bin/app \
            --driver /tmp/kstream-fetch-budget-bin/driver \
            --brokers localhost:9092 --output results/fetch-budget
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostic-fetch-budget
          path: results/fetch-budget
