name: Persistent state integration
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  storage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'
          cache: false
      - name: Verify dependency locks
        run: |
          go mod download
          go mod verify
          git diff --exit-code -- go.mod go.sum
      - name: Validate persistent state and failure boundaries
        run: go test -race -v -count=1 ./state ./execution ./adapters/pebble
