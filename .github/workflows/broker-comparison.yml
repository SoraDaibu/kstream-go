name: Exploratory broker comparison
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      kafka:
        image: apache/kafka:3.9.1
        ports:
          - 9092:9092
        env:
          CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_TRANSACTION_STATE_LOG_NUM_PARTITIONS: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify dependency locks
        run: |
          go mod download
          go mod verify
          git diff --exit-code -- go.mod go.sum
      - name: Compare verified transactional broker workloads
        env:
          KSTREAM_KAFKA_BROKERS: localhost:9092
          KSTREAM_BROKER_RECORDS: '1000000'
          KSTREAM_BROKER_WARMUP: '1000000'
          KSTREAM_BROKER_TRIALS: '5'
          KSTREAM_BROKER_OUTPUT_CAPACITY: '4096'
          KSTREAM_BROKER_FETCH_BYTES: '1048576'
        run: ./scripts/compare-brokers.sh results/broker-comparison
      - name: Profile verified Go broker workloads separately
        env:
          KSTREAM_KAFKA_BROKERS: localhost:9092
          KSTREAM_BROKER_RECORDS: '1000000'
          KSTREAM_BROKER_WARMUP: '1000000'
          KSTREAM_BROKER_TRIALS: '1'
          KSTREAM_BROKER_OUTPUT_CAPACITY: '4096'
          KSTREAM_BROKER_FETCH_BYTES: '1048576'
        run: ./scripts/compare-brokers.sh results/broker-profiles --profile-go
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exploratory-broker-comparison
          path: results/broker-comparison
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostic-go-broker-profiles
          path: results/broker-profiles
